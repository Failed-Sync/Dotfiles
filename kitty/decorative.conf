# ============================================
# KITTY — DECORATIVE PROFILE
# Comic Sans, glossy, more transparent
# Launch manually with: kitty --config ~/.config/kitty/decorative.conf
# Or from Focused profile: Ctrl+Shift+D
# ============================================

include kitty.conf

font_family      Comic Sans MS
font_size        13.0

background_opacity 0.75
background_blur    2

window_padding_width 12