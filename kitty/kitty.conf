# ============================================
# KITTY — FOCUSED PROFILE (default)
# High-contrast, monospace, for actual work
# ============================================

font_family      Comic Neue
bold_font        Comic Neue Bold
italic_font      Comic Neue Italic
bold_italic_font Comic Neue Bold Italic

background_opacity 0.92
background_blur   1

foreground       #e0e0e0
background       #141414
cursor           #999999
cursor_text_color #141414

selection_foreground #141414
selection_background #999999

color0  #1a1a1a
color8  #4d4d4d
color1  #d9534f
color9  #e57a76
color2  #7fae6f
color10 #9dc98f
color3  #d9a441
color11 #e6bc6f
color4  #6a8fb0
color12 #8fb3d4
color5  #9b7fae
color13 #b89dc9
color6  #6fb0aa
color14 #8fd4cc
color7  #b0b0b0
color15 #e0e0e0

window_padding_width 8
confirm_os_window_close 0

# Launch the Decorative profile in a new window
map ctrl+shift+d launch --type=os-window kitty --config ~/.config/kitty/decorative.conf