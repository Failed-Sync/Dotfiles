background {
    monitor =
    path = /home/dave/Pictures/Wallpapers/YOUR_WALLPAPER_HERE
    blur_passes = 3
    blur_size = 7
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.15
    vibrancy_darkness = 0.3
}

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

# CLOCK — big centered time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(224, 224, 224, 1.0)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# DATE — smaller, below clock
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color = rgba(136, 136, 136, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# FROSTED PASSWORD INPUT
input-field {
    monitor =
    size = 250, 55
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(153, 153, 153, 0.4)
    inner_color = rgba(20, 20, 20, 0.75)
    font_color = rgb(224, 224, 224)
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <span foreground="##888888">Password...</span>
    hide_input = false
    rounding = 10
    check_color = rgb(153, 153, 153)
    fail_color = rgb(217, 83, 79)
    fail_text = <i>Wrong password</i>
    position = 0, -120
    halign = center
    valign = center
}